# Better Stack Uptime Monitor Configuration — Social Agent (Nezora)
# Source of truth for all monitors. Run scripts/setup_betterstack.py to apply.
#
# check_frequency: seconds between checks (minimum: 30)
# recovery_period: seconds the monitor must be UP before resolving an incident
# ssl_expiration:  days before cert expiry to trigger an alert

monitors:

  # ── Frontend ──────────────────────────────────────────────────────────────────

  - name: "Frontend — Nezora"
    url: "{{FRONTEND_URL}}"          # e.g. https://nezora.vercel.app
    monitor_type: status
    http_method: GET
    check_frequency: 180             # every 3 minutes
    request_timeout: 30
    expected_status_codes: [200]
    verify_ssl: true
    ssl_expiration: 30               # alert 30 days before cert expiry
    regions: [us, eu, as]
    recovery_period: 180
    follow_redirects: true

  # ── Backend ───────────────────────────────────────────────────────────────────

  - name: "Backend — Health"
    url: "{{BACKEND_URL}}/health"
    monitor_type: status
    http_method: GET
    check_frequency: 60              # every 1 minute — primary liveness signal
    request_timeout: 30
    expected_status_codes: [200]
    required_keyword: '"status":"ok"' # body assertion
    verify_ssl: true
    ssl_expiration: 30
    regions: [us, eu, as]
    recovery_period: 60
    follow_redirects: true

  - name: "Backend — Deep Health (DB)"
    url: "{{BACKEND_URL}}/health/deep"
    monitor_type: status
    http_method: GET
    check_frequency: 300             # every 5 minutes — DB connectivity
    request_timeout: 30
    expected_status_codes: [200]
    required_keyword: '"db":"ok"'
    verify_ssl: true
    ssl_expiration: 30
    regions: [us, eu]
    recovery_period: 180
    follow_redirects: true

  # ── Critical Endpoints ────────────────────────────────────────────────────────
  # Strategy: probe returns 401/422 (auth error) → server is UP and processing.
  #           Any 5xx or timeout → server is DOWN.

  - name: "API — Auth Login"
    url: "{{BACKEND_URL}}/api/v1/auth/login"
    monitor_type: status
    http_method: POST
    request_headers:
      - name: Content-Type
        value: application/json
    # Intentionally invalid credentials — we expect a 401/422, never a 5xx
    request_body: '{"email":"uptime-probe@internal.dev","password":"probe"}'
    check_frequency: 300             # every 5 minutes
    request_timeout: 30
    expected_status_codes: [401, 422]
    verify_ssl: true
    ssl_expiration: 30
    regions: [us, eu]
    recovery_period: 180
    follow_redirects: true

  - name: "API — Publishing Scheduled"
    url: "{{BACKEND_URL}}/api/v1/publishing/scheduled"
    monitor_type: status
    http_method: GET
    check_frequency: 300
    request_timeout: 30
    expected_status_codes: [401, 403] # 401 = auth required → server is UP
    verify_ssl: true
    ssl_expiration: 30
    regions: [us, eu]
    recovery_period: 180
    follow_redirects: true

  # ── Scheduler ─────────────────────────────────────────────────────────────────

  - name: "Scheduler — Heartbeat"
    monitor_type: heartbeat
    period: 3                        # expect a ping at least every 3 minutes
    grace: 2                         # allow 2-minute grace before firing alert
    # The heartbeat URL is generated by Better Stack on first creation.
    # After running setup_betterstack.py, set BETTERSTACK_HEARTBEAT_URL
    # in your backend environment.

status_page:
  subdomain: nezora-status           # → nezora-status.betteruptime.com
  company_name: Nezora
  company_website: "{{FRONTEND_URL}}"
  timezone: UTC
  # All monitors above are automatically added to this page
